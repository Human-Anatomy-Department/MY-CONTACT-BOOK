<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Book Application</title>
    <style>
      /* White & Blue Theme */
      :root {
        --primary: #1d4ed8;
        --primary-hover: #1e40af;
        --bg-gradient: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border-color: #bfdbfe;
        --danger: #ef4444;
        --danger-hover: #dc2626;
        --accent-avatar: #3b82f6;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
      }

      body {
        background: var(--bg-gradient);
        color: var(--text-main);
        padding: 2rem 1rem;
        min-height: 100vh;
        display: flex;
        justify-content: center;
      }

      .app-container {
        width: 100%;
        max-width: 750px;
      }

      .header {
        text-align: center;
        margin-bottom: 1.75rem;
      }

      .header h1 {
        font-size: 2.2rem;
        color: var(--primary);
        letter-spacing: -0.5px;
      }

      .header p {
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-top: 0.25rem;
      }

      /* Counter Dashboard */
      .summary-card {
        background: var(--card-bg);
        padding: 1rem 1.5rem;
        border-radius: 12px;
        box-shadow: 0 4px 12px rgba(29, 78, 216, 0.08);
        border: 1px solid var(--border-color);
        margin-bottom: 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .summary-card h3 {
        font-size: 0.95rem;
        color: var(--text-muted);
      }

      .summary-card p {
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--primary);
      }

      /* Input Form Section */
      .form-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        box-shadow: 0 4px 15px rgba(29, 78, 216, 0.06);
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 0.85rem;
        margin-bottom: 1rem;
      }

      .form-control {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 0.95rem;
        outline: none;
        transition: all 0.2s ease;
        background: #f8fafc;
      }

      .form-control:focus {
        border-color: var(--primary);
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15);
      }

      .error-msg {
        color: var(--danger);
        font-size: 0.8rem;
        margin-top: -0.5rem;
        margin-bottom: 0.75rem;
        display: none;
      }

      .btn-group {
        display: flex;
        gap: 0.75rem;
      }

      .btn {
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .btn-primary {
        background-color: var(--primary);
        color: #ffffff;
      }

      .btn-primary:hover {
        background-color: var(--primary-hover);
      }

      .btn-cancel {
        background-color: #e2e8f0;
        color: var(--text-main);
      }

      .btn-cancel:hover {
        background-color: #cbd5e1;
      }

      .search-box {
        margin-bottom: 1.5rem;
      }

      /* Contacts List Display */
      .contacts-list {
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
      }

      .contact-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-left: 5px solid var(--primary);
        border-radius: 10px;
        padding: 1.25rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      }

      .contact-left {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex: 1;
        min-width: 0;
      }

      .avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background-color: var(--accent-avatar);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 1.2rem;
        flex-shrink: 0;
      }

      .contact-details h3 {
        font-size: 1.1rem;
        color: var(--text-main);
        margin-bottom: 0.25rem;
      }

      .contact-details p {
        font-size: 0.88rem;
        color: var(--text-muted);
        margin-bottom: 0.15rem;
        word-break: break-all;
      }

      .contact-actions {
        display: flex;
        gap: 0.5rem;
      }

      .btn-sm {
        padding: 0.4rem 0.8rem;
        font-size: 0.85rem;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }

      .btn-edit {
        background-color: #e2e8f0;
        color: var(--text-main);
      }

      .btn-edit:hover {
        background-color: #cbd5e1;
      }

      .btn-delete {
        background-color: #fee2e2;
        color: var(--danger);
      }

      .btn-delete:hover {
        background-color: var(--danger);
        color: white;
      }

      .no-contacts {
        text-align: center;
        color: var(--text-muted);
        padding: 2.5rem;
        background: var(--card-bg);
        border-radius: 10px;
        border: 1px dashed var(--border-color);
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <div class="header">
        <h1>Contact Book</h1>
        <p>Store, organize, and search your personal contacts</p>
      </div>

      <!-- Summary Box -->
      <div class="summary-card">
        <div>
          <h3>Total Saved Contacts</h3>
        </div>
        <p id="total-contacts">0</p>
      </div>

      <!-- Form Section -->
      <form id="contact-form" class="form-card" novalidate>
        <input type="hidden" id="contact-id" />
        <div class="form-grid">
          <input
            type="text"
            id="contact-name"
            class="form-control"
            placeholder="Full Name"
            required
          />
          <input
            type="tel"
            id="contact-phone"
            class="form-control"
            placeholder="Phone Number"
            required
          />
          <input
            type="email"
            id="contact-email"
            class="form-control"
            placeholder="Email Address"
            required
          />
        </div>
        <div id="validation-error" class="error-msg">
          Please enter a valid phone number and email address.
        </div>
        <div class="btn-group">
          <button type="submit" id="submit-btn" class="btn btn-primary">
            Add Contact
          </button>
          <button
            type="button"
            id="cancel-btn"
            class="btn btn-cancel"
            style="display: none"
          >
            Cancel
          </button>
        </div>
      </form>

      <!-- Search Section -->
      <div class="search-box">
        <input
          type="text"
          id="search-input"
          class="form-control"
          placeholder="Search contacts by name..."
        />
      </div>

      <!-- Contacts Display Area -->
      <div id="contacts-list" class="contacts-list"></div>
    </div>

    <script>
      let storageKey = "contact_book_records";
      let contacts = JSON.parse(localStorage.getItem(storageKey)) || [];

      const contactForm = document.getElementById("contact-form");
      const contactId = document.getElementById("contact-id");
      const contactName = document.getElementById("contact-name");
      const contactPhone = document.getElementById("contact-phone");
      const contactEmail = document.getElementById("contact-email");
      const validationError = document.getElementById("validation-error");
      const searchInput = document.getElementById("search-input");
      const contactsList = document.getElementById("contacts-list");
      const submitBtn = document.getElementById("submit-btn");
      const cancelBtn = document.getElementById("cancel-btn");
      const totalContactsEl = document.getElementById("total-contacts");

      function syncStorage() {
        localStorage.setItem(storageKey, JSON.stringify(contacts));
      }

      // Email and Phone Validation Logic
      function validateInputs(phone, email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const phoneRegex = /^[\d\+\-\s\(\)]{7,15}$/;

        return emailRegex.test(email) && phoneRegex.test(phone);
      }

      function renderContacts(query = "") {
        contactsList.innerHTML = "";

        const filtered = contacts.filter((c) =>
          c.name.toLowerCase().includes(query.toLowerCase()),
        );

        totalContactsEl.textContent = contacts.length;

        if (filtered.length === 0) {
          contactsList.innerHTML =
            '<div class="no-contacts">No contacts found.</div>';
          return;
        }

        filtered.forEach((c) => {
          const initial = c.name.charAt(0).toUpperCase() || "?";
          const card = document.createElement("div");
          card.className = "contact-card";
          card.innerHTML = `
          <div class="contact-left">
            <div class="avatar">${initial}</div>
            <div class="contact-details">
              <h3>${escapeHtml(c.name)}</h3>
              <p>📞 ${escapeHtml(c.phone)}</p>
              <p>✉️ ${escapeHtml(c.email)}</p>
            </div>
          </div>
          <div class="contact-actions">
            <button onclick="triggerEdit('${c.id}')" class="btn-sm btn-edit">Edit</button>
            <button onclick="triggerDelete('${c.id}')" class="btn-sm btn-delete">Delete</button>
          </div>
        `;
          contactsList.appendChild(card);
        });
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.innerText = str;
        return div.innerHTML;
      }

      contactForm.addEventListener("submit", (evt) => {
        evt.preventDefault();

        const nameVal = contactName.value.trim();
        const phoneVal = contactPhone.value.trim();
        const emailVal = contactEmail.value.trim();

        if (!nameVal || !validateInputs(phoneVal, emailVal)) {
          validationError.style.display = "block";
          return;
        }

        validationError.style.display = "none";
        const currentId = contactId.value;

        if (currentId) {
          contacts = contacts.map((c) =>
            c.id === currentId
              ? { ...c, name: nameVal, phone: phoneVal, email: emailVal }
              : c,
          );
        } else {
          contacts.push({
            id: "contact_" + Date.now(),
            name: nameVal,
            phone: phoneVal,
            email: emailVal,
          });
        }

        syncStorage();
        clearForm();
        renderContacts(searchInput.value);
      });

      window.triggerEdit = function (id) {
        const target = contacts.find((c) => c.id === id);
        if (!target) return;

        contactId.value = target.id;
        contactName.value = target.name;
        contactPhone.value = target.phone;
        contactEmail.value = target.email;

        submitBtn.textContent = "Update Contact";
        cancelBtn.style.display = "inline-block";
        validationError.style.display = "none";
        contactName.focus();
      };

      window.triggerDelete = function (id) {
        contacts = contacts.filter((c) => c.id !== id);
        syncStorage();
        renderContacts(searchInput.value);
      };

      function clearForm() {
        contactId.value = "";
        contactName.value = "";
        contactPhone.value = "";
        contactEmail.value = "";
        submitBtn.textContent = "Add Contact";
        cancelBtn.style.display = "none";
        validationError.style.display = "none";
      }

      cancelBtn.addEventListener("click", clearForm);

      searchInput.addEventListener("input", (e) => {
        renderContacts(e.target.value);
      });

      renderContacts();
    </script>
  </body>
</html>
